name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Pages の設定そのものから base_path を受け取る。
      # サブパス公開なら "/PURA-RECYCLE"、カスタムドメインなら ""。
      # これにより、独自ドメインへ移管するとき Settings → Pages で
      # ドメインを設定するだけで basePath が自動で外れる。
      # コードもワークフローも触らずに済むので、取り違えが起きない。
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - uses: actions/checkout@v7

      # 公開物がリポジトリと一致しているかを実際に取得して確かめる。
      # basePath の取り違え・配信の停止・Pages のルーティング変更を
      # まとめて検知する。建値が4ヶ月古いまま誰も気づかなかったことへの再発防止。
      - name: Verify published data
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS "${PAGE_URL}data/tatene.json" -o published.json; then
              break
            fi
            echo "取得できず。再試行 ${i}/5"
            sleep 10
          done
          node -e '
            const fs = require("fs");
            const key = (a) => a.map((x) => `${x.metal}:${x.price}:${x.date}`).join(" / ");
            const published = key(JSON.parse(fs.readFileSync("published.json", "utf-8")));
            const repo = key(JSON.parse(fs.readFileSync("public/data/tatene.json", "utf-8")));
            if (published !== repo) {
              console.log("::error::公開中の建値がリポジトリと一致しません");
              console.log("公開中    : " + published);
              console.log("リポジトリ: " + repo);
              process.exit(1);
            }
            console.log("公開中の建値はリポジトリと一致: " + repo);
          '
