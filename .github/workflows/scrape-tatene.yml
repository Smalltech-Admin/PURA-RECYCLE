name: Scrape Metal Prices (建値更新)

on:
  schedule:
    # 毎日午前9時（JST）に実行 = UTC 0:00
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scraping script
        run: node scripts/scrape-tatene.mjs

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet public/data/tatene.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Takumi Higashiyama"
          git config user.email "atozist@gmail.com"
          git add public/data/tatene.json
          git commit -m "chore: 建値データを自動更新 $(date +'%Y-%m-%d')"
          git push
