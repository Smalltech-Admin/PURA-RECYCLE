name: Scrape Metal Prices (建値更新)

on:
  schedule:
    # 毎日午前9時（JST）に実行 = UTC 0:00
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      skip_cross_check:
        description: '取り違え検知（月間平均との照合）を1回だけ省略する。相場が急変して正しい値が拒否されたときの逃げ道。'
        type: boolean
        default: false

permissions:
  contents: write
  # Trigger Pages deploy ステップで deploy.yml を起動するために必要
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run scraping script
        id: scrape
        env:
          SKIP_CROSS_CHECK: ${{ inputs.skip_cross_check }}
        run: node scripts/scrape-tatene.mjs

      # 買取価格の控え。画面は普段スプレッドシートを直接読むが、
      # 応答が遅い日・届かない日に空白を出さないための保険。
      # 失敗しても建値の更新と配信は止めない。
      - name: Snapshot sheet data
        continue-on-error: true
        run: node scripts/snapshot-sheets.mjs

      - name: Check for price changes
        id: changes
        run: |
          git diff --quiet public/data/tatene.json || echo "changed=true" >> $GITHUB_OUTPUT

      # 状態ファイル（最後に確認できた日時）は毎日変わるので、毎日コミットする。
      # 建値が動いた日と、動かなかったが確認はできた日を、履歴で区別できるようにする。
      # 毎日リポジトリに活動が生まれるため、GitHub が60日間の無活動で
      # scheduled workflow を自動停止することも防げる。
      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git config user.name "Takumi Higashiyama"
          git config user.email "atozist@gmail.com"
          git add public/data/tatene.json public/data/tatene-status.json
          if git diff --cached --quiet; then
            echo "変更なし。コミットしません。"
            exit 0
          fi
          if [ -n "${{ steps.scrape.outputs.failed }}" ]; then
            git commit -m "chore: 建値の取得に一部失敗（${{ steps.scrape.outputs.failed }}） $(date +'%Y-%m-%d')"
          elif [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            git commit -m "chore: 建値データを自動更新 $(date +'%Y-%m-%d')"
          else
            git commit -m "chore: 建値の取得を確認（改定なし） $(date +'%Y-%m-%d')"
          fi
          git push

      # GITHUB_TOKEN による push は他のワークフローを起動しない（GitHub の仕様）。
      # そのため deploy.yml の push トリガは建値コミットでは発火せず、
      # 2026-06-13 以降サイトが再ビルドされないまま公開内容が古いままになっていた。
      # ここから毎日明示的に呼ぶ。更新が無い日も呼ぶことで、
      # 何らかの理由で公開内容がリポジトリとずれても翌日には揃う。
      - name: Trigger Pages deploy
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --ref main

      # 取得に失敗した金属があればここでジョブを落とす。
      # スクレイパ側で exit 1 すると、取得できた金属の更新と上のデプロイまで止まる。
      # 配信を済ませてから落とすことで、GitHub からオーナーへ失敗メールが飛ぶ。
      - name: Fail if any metal could not be scraped
        if: ${{ steps.scrape.outputs.failed != '' }}
        run: |
          echo "建値の取得に失敗: ${{ steps.scrape.outputs.failed }}"
          echo "取得元ページの構造が変わった可能性があります。scripts/scrape-tatene.mjs を確認してください。"
          exit 1
